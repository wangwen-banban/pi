name: Validate incremental subagent efficiency
on:
  push:
    branches: [fix/subagent-context-efficiency]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'wangwen-banban/pi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 145f5605209253cbcfdfd55b26bc17d6b1cb2982
      PI_WEB_SESSION: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install pinned runtime
        run: npm install --global @earendil-works/pi-coding-agent@0.84.1
      - name: Run immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efficiency"
          git worktree add --detach "$RUNNER_TEMP/efficiency-base" "$BASE"
          cd "$RUNNER_TEMP/efficiency-base"
          node --experimental-strip-types --test --test-concurrency=1 --test-skip-pattern='^offline smoke: installed pi --list-models' extensions/smart-subagents/test-*.mjs extensions/plan-mode/test-*.mjs scripts/test-cache-prefix*.mjs > "$RUNNER_TEMP/efficiency/baseline.tap" 2>&1 || { cat "$RUNNER_TEMP/efficiency/baseline.tap"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/efficiency/baseline.tap"
      - name: Apply and validate bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object extensions/smart-subagents/index.ts)" = '4cf0940678d098af10751223df5beb3d3900b969'
          git apply --check .github/subagent-efficiency.patch
          git apply .github/subagent-efficiency.patch
          git diff --check
          node --experimental-strip-types --check extensions/smart-subagents/index.ts
          node --experimental-strip-types --check extensions/smart-subagents/context.ts
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = os.environ['BASE']
          old = subprocess.check_output(['git','show',base+':extensions/smart-subagents/index.ts'],text=True)
          new = Path('extensions/smart-subagents/index.ts').read_text()
          start, stop = '\tconst startJob =', '\tconst canStart ='
          old_spawn = old[old.index(start):old.index(stop)].replace('job.parentMessages, job.parentConversation, job.contextNotes','job.parentMessages, job.contextNotes')
          assert old_spawn == new[new.index(start):new.index(stop)], 'worker session, transport, permission or lifecycle changed'
          for start, stop in [('\tconst canStart =','\t// --- PI WEB'), ('\tconst parseChildEvent =','\tconst startJob =')]:
              assert old[old.index(start):old.index(stop)] == new[new.index(start):new.index(stop)], start
          assert old[old.index('\tconst deliveryObjectId ='):] == new[new.index('\tconst deliveryObjectId ='):], 'shutdown replay changed'
          PY
      - name: Test actual Pi context and production preparation functions
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 --test-skip-pattern='^offline smoke: installed pi --list-models' extensions/smart-subagents/test-*.mjs extensions/plan-mode/test-*.mjs scripts/test-cache-prefix*.mjs > "$RUNNER_TEMP/efficiency/patched.tap" 2>&1 || { cat "$RUNNER_TEMP/efficiency/patched.tap"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/efficiency/patched.tap"
      - name: Export exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          files=(extensions/smart-subagents/index.ts extensions/smart-subagents/context.ts extensions/smart-subagents/test-context.mjs extensions/smart-subagents/test-context-integration.mjs docs/subagent-efficiency.md)
          tar -czf "$RUNNER_TEMP/efficiency/candidate-source.tar.gz" "${files[@]}"
          for file in "${files[@]}"; do printf '%s\t%s\n' "$(git hash-object "$file")" "$file"; done > "$RUNNER_TEMP/efficiency/blobs.tsv"
          git diff --binary -- extensions/smart-subagents/index.ts > "$RUNNER_TEMP/efficiency/index.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: subagent-efficiency-validation
          path: ${{ runner.temp }}/efficiency/
          retention-days: 7
